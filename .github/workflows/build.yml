name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod:
    name: Skycraft Core mod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: skycraft-core-jar
          path: mod/build/libs/*.jar

  pack:
    name: Modpack (resolve, export, client & server packs)
    needs: mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest && echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: skycraft-core-jar
          path: mod-jar
      - name: Resolve mods
        run: |
          JAR="$(ls mod-jar/*.jar | grep -v -- '-sources' | head -n1)"
          tools/build-pack.sh "$JAR"
      - name: Commit resolved pack
        if: github.event_name == 'push'
        run: |
          git config user.name "skycraft-ci"
          git config user.email "skycraft-ci@users.noreply.github.com"
          git add pack
          if ! git diff --cached --quiet; then
            git commit -m "[ci] Resolve modpack"
            if git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git push origin "HEAD:${GITHUB_REF_NAME}" || echo "Could not push resolved pack; next run will retry."
            else
              git rebase --abort || true
              echo "Branch moved; resolved pack not pushed (next run will retry)."
            fi
          fi
      - name: Export Modrinth & CurseForge packs
        working-directory: pack
        run: |
          mkdir -p ../dist
          packwiz modrinth export -o ../dist/Skycraft.mrpack || true
          packwiz curseforge export -o ../dist/Skycraft-curseforge.zip || true
      - name: Build client instance and server
        run: tools/make-instances.sh
      - name: Server smoke test (boot the full pack and generate the world)
        run: tools/test-server.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-logs
          path: dist/server-test
      - uses: actions/upload-artifact@v4
        with:
          name: Skycraft-client-instance
          path: dist/Skycraft-client-instance.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Skycraft-server
          path: dist/Skycraft-server.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Skycraft-exports
          path: |
            dist/Skycraft.mrpack
            dist/Skycraft-curseforge.zip
            pack/RESOLVE_REPORT.md
