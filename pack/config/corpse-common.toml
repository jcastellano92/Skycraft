# Corpse Mod Configuration for Skycraft

[corpse]
# Whether only the owner can access the corpse. False allows other players to protect and loot it.
only_owner = false

# Time in seconds after which an empty corpse despawns.
empty_corpse_despawn_time = 30

# Time in seconds after which a corpse despawns (-1 for never).
max_corpse_age = -1

# Whether the corpse can fall into the void.
fall_in_void = false

# Whether lava destroys the corpse.
lava_damage = false

